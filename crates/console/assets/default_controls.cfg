// Default controls — Black Ops II's own PC keys, from the retail game's
// players/bindings_mp.bdg. Keys whose command we do not have yet are left
// out: E/Q lean, "." class hotkey, F10 screenshot, PAUSE.
// Edit and re-run `binddefaults`, or paste lines into the console.

bind W +forward
bind S +back
bind A +moveleft
bind D +moveright
bind SPACE +gostand
bind C +stance
bind CTRL toggleprone
bind SHIFT +breath_sprint

bind MOUSE1 +attack
// Retail binds +toggleads_throw with ADS on hold; our +toggleads_throw
// is a true toggle, so hold-to-aim is +speed_throw here.
bind MOUSE2 +speed_throw
bind MOUSE3 +frag
bind MWHEELUP +weapnext_inventory
bind MWHEELDOWN weapprev

bind F +activate
bind G +frag
bind R +reload
bind V +melee
bind 4 +smoke
bind TAB +scores

bind 1 +actionslot 1
bind 2 +actionslot 2
bind 3 +actionslot 4
bind 5 +actionslot 3

bind T chatmodepublic
bind Y chatmodeteam
bind Z +talk
